name: N1 Python contracts
on:
  pull_request:
    paths:
      - 'scieval-vika-p0/**'
      - 'VERSION'
      - '.github/workflows/n1-python.yml'
  push:
    branches: ['scieval/n1-contracts-t57']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B -m unittest discover -s tests -v
        working-directory: scieval-vika-p0
