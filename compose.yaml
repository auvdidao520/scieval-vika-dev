name: scieval-vika-dev
services:
  vika-dev:
    image: m.daocloud.io/docker.io/library/node:24-bookworm@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    working_dir: /project/vika
    environment:
      VIKA_WORKSPACE: /dev-workspace
      VIKA_DATA_DIR: /dev-state
    volumes:
      - ./vika:/project/vika
      - dependencies:/project/vika/node_modules
      - ./workspace:/dev-workspace
      - state:/dev-state
    command: ["npm", "test"]
volumes:
  dependencies:
  state:
